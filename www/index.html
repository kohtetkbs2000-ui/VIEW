<!DOCTYPE html>
<html lang="my"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="View Digital Printing">
<title>View Digital Printing</title>
<style>
:root{--bg:#f2f2f7;--c:#fff;--t:#000;--m:#8e8e93;--a:#007aff;--b:#e5e5ea;--g:#34c759;--bb:#e4e6eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--c:#1c1c1e;--t:#fff;--b:#38383a;--bb:#303030}}
:root[data-theme="dark"]{--bg:#000;--c:#1c1c1e;--t:#fff;--b:#38383a;--bb:#303030}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;background:var(--bg);color:var(--t);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;max-width:640px;padding:0 16px 170px}
h2{margin:16px 0 8px;font-size:22px}#ttl{font-size:26px;margin:12px 0 6px;font-weight:700;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}#logo{width:42px;height:42px;border-radius:11px;box-shadow:0 2px 8px #0003}
button,input,select,textarea{font:inherit;color:var(--t)}
input,select{width:100%;padding:11px 12px;border:0;border-radius:10px;background:var(--c);margin:4px 0;font-size:16px}
button,.btn{padding:11px 16px;border:0;border-radius:12px;background:var(--a);color:#fff;font-weight:600;cursor:pointer;text-align:center;display:inline-block}button:active{opacity:.6}
button.g,.btn.g{background:var(--c);color:var(--a)}button.s{padding:6px 12px;font-size:14px;border-radius:99px}.big{width:100%;margin:8px 0;padding:15px;font-size:18px}
a{color:var(--a);cursor:pointer}.card{background:var(--c);border-radius:14px;padding:14px;margin:10px 0}
.grid{columns:2;column-gap:12px}.it{background:var(--c);border-radius:14px;overflow:hidden;position:relative;break-inside:avoid;margin-bottom:12px}.it img{width:100%;display:block;background:#8883;min-height:80px}
.it div{padding:8px 10px}.code{font-weight:700;color:var(--a)}.m{color:var(--m);font-size:14px}
.pct{position:absolute;top:8px;right:8px;background:var(--g);color:#fff;border-radius:99px;padding:2px 8px;font-size:12px;font-weight:700}
nav{display:flex;position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--c) 85%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--b);z-index:9}
nav button{flex:1;background:none;color:var(--m);font-size:10px;padding:4px 1px;font-weight:500;min-width:0}nav button span{display:block;font-size:20px}nav button.on{color:var(--a)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:8px 0}.chips span{padding:6px 14px;border-radius:99px;cursor:pointer;background:var(--c);white-space:nowrap;font-size:15px}.chips span.on{background:var(--a);color:#fff}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>button,.row>.btn{flex:none}.sb{display:flex;gap:8px;align-items:center}.sb input{flex:1}
.v{border:1.5px dashed var(--m)}.badge{padding:2px 9px;border-radius:99px;font-size:12px;background:#8883}
.chat{max-height:280px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:8px 0}.msg{padding:8px 12px;border-radius:18px;background:var(--c);max-width:80%}.msg.me{align-self:flex-end;background:var(--a);color:#fff}.msg img{max-width:100%;border-radius:10px}
.cart{position:fixed;left:10px;right:10px;bottom:calc(64px + env(safe-area-inset-bottom,0px));padding:12px 14px;background:color-mix(in srgb,var(--c) 90%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:18px;max-width:620px;margin:auto;box-shadow:0 4px 20px #0003;z-index:8}
.hero{padding-top:24px;text-align:center}.hero input{text-align:left}
#sync{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:12px;background:var(--c);border-radius:99px;padding:5px 12px;font-size:13px;box-shadow:0 2px 10px #0003;display:none;z-index:20;align-items:center;gap:7px}#sync.on{display:flex}
.ring,#sync i{border:3px solid #8884;border-top-color:var(--a);border-radius:50%;animation:sp .8s linear infinite}#sync i{width:14px;height:14px;border-width:2px}.ring{width:46px;height:46px}
#ov{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:30;text-align:center;padding:20px}#ov.on{display:flex}
.dots b{display:inline-block;width:9px;height:9px;margin:0 3px;border-radius:50%;background:var(--a);animation:bn 1s infinite}.dots b:nth-child(2){animation-delay:.15s}.dots b:nth-child(3){animation-delay:.3s}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes bn{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-8px);opacity:1}}
.chatw{display:flex;flex-direction:column;height:calc(100dvh - 215px);min-height:300px}.chh{display:flex;align-items:center;gap:10px;padding:6px 0}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#06b6d4);color:#fff;font-style:normal;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:14px}.av.sp{background:none}.chh .av{width:42px;height:42px;font-size:19px}
#chat{flex:1;overflow:auto;display:flex;flex-direction:column;padding:6px 0}
.mb{display:flex;align-items:flex-end;gap:6px;margin:1px 0}.mb.me{justify-content:flex-end}
.bub{max-width:78%;padding:8px 13px;border-radius:20px;background:var(--bb);word-break:break-word;white-space:pre-wrap}
.me .bub{background:#0084ff;color:#fff}.bub.t{border-top-left-radius:6px}.bub.b{border-bottom-left-radius:6px}.me .bub.t{border-top-left-radius:20px;border-top-right-radius:6px}.me .bub.b{border-bottom-left-radius:20px;border-bottom-right-radius:6px}
.bub img{max-width:100%;border-radius:12px;display:block;margin:2px 0 4px}.ts{text-align:center;color:var(--m);font-size:12px;margin:10px 0 4px}
.bub.oc,.me .bub.oc{background:var(--c);color:var(--t);border:1px solid var(--b);width:88%;white-space:normal}.bub.oc button{margin-top:6px}
.inb{display:flex;align-items:center;gap:8px;padding:8px 0}.inb input[type=text]{flex:1;border-radius:22px;padding:11px 16px;margin:0;background:var(--bb)}.ic{font-size:24px;cursor:pointer}.snd{width:42px;height:42px;border-radius:50%;padding:0;font-size:16px;background:#0084ff}
input[type=date]{min-height:44px;-webkit-appearance:none;appearance:none;max-width:100%;color-scheme:light dark}
.ok{display:inline-flex;width:17px;height:17px;border-radius:50%;background:var(--g);color:#fff;font-size:11px;align-items:center;justify-content:center;vertical-align:-3px;animation:pop .4s}
.prn{position:relative;display:inline-block;animation:bob .5s ease-in-out infinite alternate}.prn:after{content:"";position:absolute;left:4px;right:4px;bottom:-2px;height:6px;background:#fff;border:1px solid #8886;border-top:0;animation:pp 1s linear infinite}
@keyframes bob{to{transform:translateY(-1.5px)}}@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}@keyframes pp{0%{height:0}60%{height:7px}100%{height:7px;opacity:0}}
.qmr{display:flex;gap:6px;overflow-x:auto;padding:6px 0}.qc{white-space:nowrap;padding:7px 12px;border-radius:99px;background:var(--bb);font-size:14px;cursor:pointer}.qc.a{background:var(--c);color:var(--a)}
.rc{flex:1;display:flex;align-items:center;gap:8px;color:#ff3b30}.rc i{width:10px;height:10px;border-radius:50%;background:#ff3b30;animation:bn 1s infinite}.st{text-align:right;color:var(--m);font-size:11px;margin:0 4px 4px}audio{width:210px;height:40px}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;min-height:0;display:block}input[type=time]{min-height:44px;-webkit-appearance:none;appearance:none;max-width:100%}
textarea{width:100%;border:0;border-radius:10px;padding:10px;background:var(--c);font-size:16px;margin:4px 0;color:var(--t)}
.pw{position:relative}.pw input{padding-right:46px}.pw span{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:20px;opacity:.7}
.stk{font-size:15px;font-weight:700;margin:2px 0}.stk.in{color:#34c759}.stk.out{color:#ff3b30}.dsc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style></head><body>

 for(let y=0;y<16;y++)for(let a=0;a<16;a++){const p=(y*17+a)*4;d+=(g[p]+g[p+1]+g[p+2])>(g[p+4]+g[p+5]+g[p+6])?1:0}

function bell(s){try{const A=window.AudioContext||window.webkitAudioContext,a=bell.a||(bell.a=new A()),t=a.currentTime;[[1318,0],[1760,.12]].slice(0,s?1:2).forEach(([f,d])=>{const o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.25,t+d+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d+(s?.25:.6));o.connect(g);g.connect(a.destination);o.start(t+d);o.stop(t+d+.7)})}catch(e){}}
const PT=()=>({per:1000,l2:500000,l3:2000000,...(S.settings.pts||{})});
const lvT=l=>["","🥉 Level 1","🥈 Level 2","🥇 Level 3"][l];
function ptsInfo(u){const p=PT(),sp=Object.values(S.orders).filter(o=>o.user===u&&(o.status==="approved"||o.status==="done")).reduce((a,o)=>a+(o.total||0),0),earned=Math.floor(sp/p.per),used=Object.values(S.reds).filter(r=>r.user===u&&r.st!=="no").reduce((a,r)=>a+r.cost,0),adj=(S.users[u]||{}).padj||0;return{sp,earned,used,adj,bal:earned+adj-used,lv:sp>=p.l3?3:sp>=p.l2?2:1}}
function vPts(){const i=ptsInfo(sess.user),p=PT(),nx=i.lv===1?p.l2:i.lv===2?p.l3:0,gl=S.settings.gifts?.list||[],my=Object.values(S.reds).filter(r=>r.user===sess.user).sort((a,b)=>b.ts-a.ts);
 $("#app").innerHTML=`<div class="card" style="text-align:center"><div>${lvT(i.lv)}</div><div style="font-size:44px;font-weight:800;color:var(--a)">${i.bal}</div><div class="m">ရရှိထားသော Points</div><div class="m" style="margin-top:6px">ဝယ်ယူငွေ ${mm(i.sp)}${nx?` · နောက်အဆင့်အတွက် ${mm(Math.max(0,nx-i.sp))} လိုသည်`:" · အမြင့်ဆုံးအဆင့်"}</div><div class="m">${mm(p.per)} ဝယ်တိုင်း ၁ point</div></div>
 <h2>🎁 လက်ဆောင်လဲလှယ်ရန်</h2>${gl.map(g=>`<div class="card row">${g.img?`<img data-i="${g.img}" style="width:64px;height:64px;object-fit:cover;border-radius:10px;flex:none">`:""}<div><b>${E(g.name)}</b><div class="m">${g.cost} pts</div></div><button class="s" ${i.bal>=g.cost?"":'disabled style="opacity:.4"'} onclick="redeem('${g.id}')">လဲမည်</button></div>`).join("")||`<p class="m">လက်ဆောင် မရှိသေးပါ</p>`}
 ${my.length?`<h2>📜 မှတ်တမ်း</h2>`+my.map(r=>`<div class="card"><b>${E(r.gift)}</b> <span class="badge">${r.st==="given"?"✅ ပေးပြီး":r.st==="no"?"❌ ငြင်း":"⏳ စောင့်ဆိုင်း"}</span><div class="m">${r.cost} pts · ${new Date(r.ts).toLocaleDateString()}</div></div>`).join(""):""}`}
function redeem(gid){const g=(S.settings.gifts?.list||[]).find(x=>x.id===gid);if(!g||ptsInfo(sess.user).bal<g.cost)return alert("Points မလောက်ပါ");if(!confirm(g.name+" ကို "+g.cost+" pts နဲ့ လဲမလား?"))return;
 put("reds",{id:nid("r"),user:sess.user,gift:g.name,cost:g.cost,st:"pending",ts:Date.now()});put("msgs",{id:nid("m"),o:"c_"+sess.user,admin:false,text:"🎁 လက်ဆောင်လဲလှယ်ရန် တောင်းဆိုသည် — "+g.name+" ("+g.cost+" pts)",ts:Date.now()});bell();vPts();hyd()}
function vPtsA(){const p=PT(),gl=S.settings.gifts?.list||[],rq=Object.values(S.reds).filter(r=>r.st==="pending").sort((a,b)=>a.ts-b.ts),
 us=Object.values(S.users).filter(u=>u.role==="cus"&&!u.del&&u.status!=="pending"&&u.status!=="rejected").map(u=>({u,i:ptsInfo(u.id)})).sort((a,b)=>b.i.sp-a.i.sp);
 $("#app").innerHTML=`<div class="card"><b>⚙️ Points စည်းမျဉ်း</b><label class="m">ကျပ် ဘယ်လောက်ဝယ်ရင် ၁ point</label><input id="g1" type="number" value="${p.per}"><label class="m">Level 2 (ဝယ်ယူငွေ ≥)</label><input id="g2" type="number" value="${p.l2}"><label class="m">Level 3 (ဝယ်ယူငွေ ≥)</label><input id="g3" type="number" value="${p.l3}"><button class="big" onclick="savePts()">Save</button></div>
 <div class="card"><b>🎁 လက်ဆောင်များ</b>${gl.map((g,k)=>`<div class="row" style="margin:8px 0;gap:10px">${g.img?`<img data-i="${g.img}" style="width:48px;height:48px;object-fit:cover;border-radius:8px;flex:none">`:`<span style="width:48px;flex:none;text-align:center;font-size:26px">🎁</span>`}<span>${E(g.name)} · ${g.cost} pts</span><label class="btn g s" style="flex:none">📷<input type="file" accept="image/*" hidden onchange="giftPic(this,${k})"></label><button class="g s" onclick="delGift(${k})">✕</button></div>`).join("")}<div style="margin-top:10px"><input id="gn" placeholder="လက်ဆောင်အမည်"><div class="row"><input id="gc" type="number" placeholder="pts (လိုအပ်သော Points)"><input id="gf" type="file" accept="image/*"></div><button class="big" onclick="addGift()">➕ လက်ဆောင်ထည့်မည်</button></div></div>
 ${rq.length?`<div class="card"><b>⏳ လဲလှယ်ရန် တောင်းဆိုမှုများ</b>${rq.map(r=>`<div class="card" style="background:var(--bg)"><b>${E(S.users[r.user]?.name||r.user)}</b> — ${E(r.gift)} (${r.cost} pts)<div class="row" style="margin-top:6px"><button class="s" onclick="giveR('${r.id}','given')">✔ ပေးပြီး</button><button class="g s" onclick="giveR('${r.id}','no')">✕ ငြင်း</button></div></div>`).join("")}</div>`:""}
 <div class="card"><b>🏆 ဝယ်ယူမှုအများဆုံး (ငွေကြေး)</b>${us.map(({u,i},k)=>`<div class="row" style="gap:10px;margin:8px 0" onclick="custD='${u.id}';tab='cust';render()"><b style="flex:none;width:24px">${k+1}</b>${avU(u,36)}<div style="min-width:0"><b>${E(u.name)}</b> <span class="badge">${lvT(i.lv)}</span><div class="m">${mm(i.sp)} · ${i.bal} pts</div></div></div>`).join("")||`<p class="m">Customer မရှိသေးပါ</p>`}</div>`;hyd()}
function savePts(){put("settings",{id:"pts",per:+$("#g1").value||1000,l2:+$("#g2").value||0,l3:+$("#g3").value||0});alert("သိမ်းပြီး");vPtsA()}
async function addGift(){const n=$("#gn").value.trim(),c=+$("#gc").value,f=$("#gf").files[0];if(!n||!c)return alert("အမည်နှင့် Points ထည့်ပါ");ov("Save လုပ်နေပါသည်…");const g={id:nid("g"),name:n,cost:c};if(f)g.img=await putImg(await shrink(f,600));put("settings",{id:"gifts",list:[...(S.settings.gifts?.list||[]),g]});ov(0);vPtsA()}
async function giftPic(i,k){const f=i.files[0];if(!f)return;const l=(S.settings.gifts?.list||[]).slice();if(!l[k])return;l[k]={...l[k],img:await putImg(await shrink(f,600))};put("settings",{id:"gifts",list:l});vPtsA()}
function delGift(k){const l=(S.settings.gifts?.list||[]).slice();l.splice(k,1);put("settings",{id:"gifts",list:l});vPtsA()}
function giveR(id,st){const r=S.reds[id];put("reds",{...r,st});sysMsg(r.user,st==="given"?`🎁 ${r.gift} လက်ဆောင် ပေးပြီးပါပြီ`:`❌ ${r.gift} လဲလှယ်မှုကို ငြင်းပယ်ထားပါသည် (Points ပြန်ရမည်)`);vPtsA()}
function ptsBlock(id){const i=ptsInfo(id);return `<div class="card"><b>⭐ ${lvT(i.lv)}</b><div class="m">ဝယ်ယူငွေ စုစုပေါင်း: <b>${mm(i.sp)}</b></div><div class="m">ရရှိ ${i.earned} · ချိန်ညှိ ${i.adj} · သုံးပြီး ${i.used}</div><div style="font-size:24px;font-weight:700">${i.bal} pts</div><div class="row" style="margin-top:6px"><input id="pj" type="number" placeholder="Points ချိန်ညှိ (+/-)"><button class="s" onclick="adjP('${id}')">ချိန်ညှိ</button></div></div>`}
function adjP(id){const v=+$("#pj").value;if(!v)return;const u=S.users[id];put("users",{...u,padj:(u.padj||0)+v});vCustD()}
// ---------- boot ----------
(async()=>{try{const s=await kv.get("S");if(s)S={...S,...s};D=(await kv.get("D"))||{};LS=(await kv.get("LS"))||{}}catch(e){}
 if(sess)tab=sess.role==="admin"?"orders":"shop";
 if(!cfg.url&&!off){setup();return}
 if(cfg.url&&!off){ov("ဒေတာ ရယူနေပါသည်…");await sync()}ov(0);render();beat()})();
</script></body></html>
